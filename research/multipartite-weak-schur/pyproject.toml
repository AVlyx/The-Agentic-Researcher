description = "Multipartite weak Schur sampling: isotypic-projector tuples, Kronecker positivity, and Schmidt-rank profiles"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "schur-weyl>=0.2.0",
    "toqito>=1.0.8",
]

[tool.uv]
package = false
